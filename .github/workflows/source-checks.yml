name: Source integrity (does not compile PLC code)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -v
      - run: python -m tcforge_sim --trace artifacts/cylinder-trace.jsonl
